<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Veyro Run — caption cards</title>
<style>
@font-face{font-family:Anybody;src:url(fonts/anybody.woff2) format('woff2');font-weight:100 900;font-stretch:50% 150%;}
@font-face{font-family:Mono;src:url(fonts/fragment-mono.woff2) format('woff2');font-weight:400;}
html,body{margin:0;background:transparent;overflow:hidden}
#stage{position:relative;width:1920px;height:1080px}
/* the riso plate: a pink plate printed slightly off-register behind the card */
.card{position:absolute;display:inline-block}
.card .pink{position:absolute;left:10px;top:8px;right:-10px;bottom:-8px;border-radius:18px;background:#EE3D87}
.card .plate{position:relative;border-radius:18px;padding:22px 30px 26px;overflow:hidden}
.card .plate canvas{position:absolute;left:0;top:0;pointer-events:none}
.card .line{position:relative;font-family:Anybody;font-weight:800;font-stretch:94%;letter-spacing:-.012em;line-height:1.1;white-space:nowrap}
/* N.png — sits on the paper side panels of the phone footage: ink plate, paper type */
.card.panel .plate{background:#12454C;color:#FBF5E9}
/* Nw.png — lower third over full-frame room footage: paper plate, ink type, ink keyline */
.card.wide .plate{background:#FBF5E9;color:#12454C;box-shadow:inset 0 0 0 3px #12454C}
</style>
</head>
<body>
<div id="stage"></div>
<script>
'use strict';
// Every caption is split on " · " into lines, set in one size across the whole set so the cards read as a system.
// text column per variant: the phone footage leaves ~711 px paper panels (card inside x 64..690); room footage is full-frame
const MAXW={panel:556,wide:860},CAP={panel:[50,38],wide:[60,46]};
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function grain(w,h,dark,seed){const c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d');const d=g.createImageData(w,h);const r=mulberry32(seed);
  for(let i=0;i<d.data.length;i+=4){const n=r();if(dark){const v=n>.985?255:n>.93?90:0;d.data[i]=d.data[i+1]=d.data[i+2]=255;d.data[i+3]=v*.28;}
    else{const v=Math.pow(r(),5)*110+n*18;d.data[i]=d.data[i+1]=d.data[i+2]=0x12;d.data[i+3]=v*.55;}}
  g.putImageData(d,0,0);return c;}
function measure(lines,weight){
  const wrap=document.createElement('div');wrap.className='card';wrap.style.visibility='hidden';const probe=document.createElement('div');probe.className='line';probe.style.fontSize='100px';probe.style.fontWeight=weight;probe.style.display='inline-block';wrap.appendChild(probe);document.body.appendChild(wrap);
  let mx=0;for(const l of lines){probe.textContent=l.replace(/'/g,'’');mx=Math.max(mx,probe.getBoundingClientRect().width);}wrap.remove();return mx;}
// one headline size and one sub-line size per variant, shared by every card in the set
function fitSizes(all,variant){const heads=all.map(s=>s.split(' · ')[0]),subs=all.flatMap(s=>s.split(' · ').slice(1));
  return [Math.min(CAP[variant][0],Math.floor(MAXW[variant]*100/measure(heads,800))),Math.min(CAP[variant][1],Math.floor(MAXW[variant]*100/measure(subs,700)))];}
var SIZES={panel:[44,34],wide:[52,40]};
window.renderCard=(text,variant,seed)=>{
  const st=document.getElementById('stage');st.innerHTML='';
  const card=document.createElement('div');card.className='card '+variant;
  const pink=document.createElement('div');pink.className='pink';card.appendChild(pink);
  const plate=document.createElement('div');plate.className='plate';card.appendChild(plate);
  for(const [k,l] of text.split(' · ').entries()){const d=document.createElement('div');d.className='line';d.style.fontSize=SIZES[variant][k?1:0]+'px';d.style.fontWeight=k?700:800;if(k===1)d.style.marginTop='.12em';d.textContent=l.replace(/'/g,'’');plate.appendChild(d);}
  st.appendChild(card);
  const r=plate.getBoundingClientRect();const gc=grain(Math.ceil(r.width),Math.ceil(r.height),variant==='panel',seed);plate.insertBefore(gc,plate.firstChild);
  if(variant==='panel'){card.style.left='64px';card.style.top='96px';}
  else{card.style.left='96px';card.style.top=(1080-120-r.height)+'px';}
  const b=card.getBoundingClientRect();return {x:b.x,y:b.y,w:b.width+10,h:b.height+8};
};
window.setCaptions=list=>{SIZES={panel:fitSizes(list,'panel'),wide:fitSizes(list,'wide')};return SIZES;};
window.ready=(async()=>{await document.fonts.load('800 100px Anybody');await document.fonts.ready;return true;})();
</script>
</body>
</html>
