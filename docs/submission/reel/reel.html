<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Veyro Run — 20 s motion reel</title>
<style>
@font-face{font-family:Anybody;src:url(fonts/anybody.woff2) format('woff2');font-weight:100 900;font-stretch:50% 150%;}
@font-face{font-family:Atkinson;src:url(fonts/atkinson-400.woff2) format('woff2');font-weight:400;}
@font-face{font-family:Atkinson;src:url(fonts/atkinson-700.woff2) format('woff2');font-weight:700;}
@font-face{font-family:Mono;src:url(fonts/fragment-mono.woff2) format('woff2');font-weight:400;}
html,body{margin:0;background:#0b1c1f;overflow:hidden}
#stage{position:relative;width:1920px;height:1080px;overflow:hidden;background:#FBF5E9;transform-origin:50% 50%}
#stage canvas{position:absolute;left:0;top:0}
#p3wrap{position:absolute;left:0;top:0;width:1920px;height:1080px;perspective:1500px;perspective-origin:1290px 545px}
#p3{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-style:preserve-3d;transform-origin:1290px 545px;display:none}
#p3 canvas{position:absolute;left:0;top:0}
#p3back{position:absolute;left:1070px;top:95px;width:440px;height:900px;border-radius:66px;background:#EE3D87;transform:translate3d(6px,4px,-26px)}
.p3side{position:absolute;top:152px;width:26px;height:786px;background:#0E393F;border-radius:12px}
#p3l{left:1057px;transform:translateZ(-13px) rotateY(90deg)}
#p3r{left:1497px;transform:translateZ(-13px) rotateY(90deg)}
#type{position:absolute;left:0;top:0;width:1920px;height:1080px;pointer-events:none}
.txt{position:absolute;left:0;top:0;transform-origin:0 0;white-space:nowrap;will-change:transform}
.txt .layer{white-space:nowrap}
.txt .p{position:absolute;left:0;top:0}
.txt .k{position:relative}
.txt span{display:inline-block;transform-origin:50% 80%}
#grainM{mix-blend-mode:multiply}
#grainS{mix-blend-mode:screen}
#ui{position:fixed;left:0;top:1080px;color:#ccc;font:13px Mono;padding:6px}
</style>
</head>
<body>
<div id="stage">
  <canvas id="main" width="1920" height="1080"></canvas>
  <div id="p3wrap"><div id="p3"><div id="p3back"></div><div class="p3side" id="p3l"></div><div class="p3side" id="p3r"></div><canvas id="phone" width="1920" height="1080"></canvas></div></div>
  <div id="type"></div>
  <canvas id="top" width="1920" height="1080"></canvas>
  <canvas id="grainM" width="1920" height="1080"></canvas>
  <canvas id="grainS" width="1920" height="1080"></canvas>
</div>
<script>
'use strict';
/* ============================================================
   Veyro Run — 20 s motion reel. Everything is a pure function of t
   (seconds): window.seek(t) draws one frame, so a headless browser
   can capture it frame by frame (render.mjs) with no clock involved.
   Palette and type are the product's own (site/public/styles.css);
   every number shown on screen is the game's real constant.
   ============================================================ */
const W=1920,H=1080,DUR=20;           // design timeline, in 120-BPM seconds
const TS=90/120;                        // output plays it at 90 BPM
const OUT_DUR=DUR/TS;
const C={ink:'#12454C',paper:'#FBF5E9',pink:'#EE3D87',mint:'#87BEA6',gold:'#FFC85C',leaf:'#358C7F',
  coral:'#D86755',stone:'#C6B69B',pathStone:'#E9DFCB',sage:'#E8EDDB',item:'#FFFCF4',secondary:'#456A69',
  mintLight:'#A8D2BB',inkLight:'#1B5963',inkDeep:'#0E393F',goldDark:'#E3A33A',coralLight:'#E98D7B',
  leafDark:'#28695F',pinkLight:'#F6B3CD',stoneDark:'#D7CAB0',haze:'#CFE3D2'};

/* ---------- math ---------- */
const clamp=(x,a=0,b=1)=>x<a?a:x>b?b:x;
const lerp=(a,b,t)=>a+(b-a)*t;
const seg=(t,a,b)=>clamp((t-a)/(b-a));
const E={
  lin:x=>x,
  inQuad:x=>x*x, outQuad:x=>1-(1-x)*(1-x),
  inCubic:x=>x*x*x, outCubic:x=>1-Math.pow(1-x,3),
  inOutCubic:x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2,
  outQuart:x=>1-Math.pow(1-x,4), inQuart:x=>x*x*x*x,
  inOutQuart:x=>x<.5?8*x*x*x*x:1-Math.pow(-2*x+2,4)/2,
  outQuint:x=>1-Math.pow(1-x,5),
  outExpo:x=>x>=1?1:1-Math.pow(2,-10*x), inExpo:x=>x<=0?0:Math.pow(2,10*x-10),
  inOutExpo:x=>x<=0?0:x>=1?1:x<.5?Math.pow(2,20*x-10)/2:(2-Math.pow(2,-20*x+10))/2,
  outBack:x=>{const s=1.70158;return 1+(s+1)*Math.pow(x-1,3)+s*Math.pow(x-1,2);},
  outBackBig:x=>{const s=2.6;return 1+(s+1)*Math.pow(x-1,3)+s*Math.pow(x-1,2);},
  inBack:x=>{const s=1.70158;return (s+1)*x*x*x-s*x*x;},
  inOutBack:x=>{const c=1.70158*1.525;return x<.5?(Math.pow(2*x,2)*((c+1)*2*x-c))/2:(Math.pow(2*x-2,2)*((c+1)*(x*2-2)+c)+2)/2;},
};
// Critically-under-damped spring from 0 to 1, started at dt=0.
function spring(dt,f=2.2,z=.42){if(dt<=0)return 0;const w=2*Math.PI*f,wd=w*Math.sqrt(1-z*z);return 1-Math.exp(-z*w*dt)*(Math.cos(wd*dt)+z*w/wd*Math.sin(wd*dt));}
// Impulse (a decaying wobble) started at dt=0.
function wob(dt,f=6,z=.18){if(dt<=0)return 0;const w=2*Math.PI*f;return Math.exp(-z*w*dt)*Math.sin(w*Math.sqrt(1-z*z)*dt);}
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function mix(c1,c2,t){const a=hex(c1),b=hex(c2);return `rgb(${Math.round(lerp(a[0],b[0],t))},${Math.round(lerp(a[1],b[1],t))},${Math.round(lerp(a[2],b[2],t))})`;}
function hex(c){if(c[0]!=='#'){const m=c.match(/\d+/g);return m.map(Number);}return [1,3,5].map(i=>parseInt(c.substr(i,2),16));}
function rgba(c,a){const h=hex(c);return `rgba(${h[0]},${h[1]},${h[2]},${a})`;}

/* ---------- real product data ---------- */
const GAME={lanes:3,laneW:1.6,v0:7.5,g:22,restY:.5,barrierTop:.5,speed:12};
GAME.rise=GAME.v0*GAME.v0/(2*GAME.g);          // 1.28 m
GAME.apex=GAME.restY+GAME.rise;                 // 1.78 m
GAME.air=2*GAME.v0/GAME.g;                      // 0.68 s
const jumpY=tau=>tau<=0||tau>=GAME.air?0:GAME.v0*tau-.5*GAME.g*tau*tau;
// DailySeed.ForDate + RunSeed.RngState (FNV-1a), exactly as the game computes them.
function rngState(seed,cv,wid){
  let h=2166136261>>>0;const mul=()=>{h=Math.imul(h,16777619)>>>0;};
  for(let i=0;i<4;i++){h=(h^((seed>>>(i*8))&0xFF))>>>0;mul();}
  const hs=s=>{h=(h^0xFF)>>>0;mul();for(const ch of s){const c=ch.charCodeAt(0);h=(h^(c&0xFF))>>>0;mul();h=(h^((c>>8)&0xFF))>>>0;mul();}};
  hs(cv);hs(wid);return h===0?0x9E3779B9:h;}
const DAY={y:2026,m:9,d:30};
DAY.seed=DAY.y*10000+DAY.m*100+DAY.d;
DAY.label='2026-09-30';
DAY.state=rngState(DAY.seed,'greybox-1','greybox');
DAY.hex=DAY.state.toString(16).toUpperCase().padStart(8,'0');

/* ---------- canvases ---------- */
const stage=document.getElementById('stage');
const main=document.getElementById('main').getContext('2d');
const ov=document.getElementById('top').getContext('2d');
const gM=document.getElementById('grainM').getContext('2d');
const gS=document.getElementById('grainS').getContext('2d');
const typeRoot=document.getElementById('type');
const phc=document.getElementById('phone').getContext('2d');
const P3={box:document.getElementById('p3'),back:document.getElementById('p3back'),l:document.getElementById('p3l'),r:document.getElementById('p3r')};

/* ---------- images ---------- */
const IMG={};
function loadImg(k,src){return new Promise(r=>{const i=new Image();i.onload=()=>{IMG[k]=i;i.decode().then(r,r);};i.src=src;});}

/* ---------- audio cue list (read by the render script for the mix) ---------- */
const EVENTS=[];
const ev=()=>{}; // cues are listed once in buildCues()

/* ============================================================
   TYPE — DOM text so the Anybody variable axes (wdth/wght) can
   animate per letter. Each Txt is two copies: a pink plate offset
   behind an ink plate, i.e. a two-colour riso print.
   ============================================================ */
const TXTS=[];
class Txt{
  constructor(text,o={}){
    this.o=Object.assign({font:'Anybody',size:160,wght:900,wdth:100,color:C.ink,pink:C.pink,blend:'normal',ls:-.035,lh:.9},o);
    this.text=text;this.el=document.createElement('div');this.el.className='txt';this.layers=[];
    for(const k of ['p','k']){const L=document.createElement('div');L.className='layer '+k;
      const spans=[...text].map(ch=>{const s=document.createElement('span');s.textContent=ch===' '?' ':ch;L.appendChild(s);return s;});
      this.el.appendChild(L);this.layers.push({L,spans});}
    typeRoot.appendChild(this.el);TXTS.push(this);this.shown=false;this.el.style.display='none';
  }
  set(s){
    const o=Object.assign({},this.o,s);const el=this.el;this.shown=true;el.style.display='block';
    el.style.fontFamily=o.font;el.style.fontSize=o.size+'px';el.style.fontWeight=o.wght;el.style.fontStretch=o.wdth+'%';
    el.style.letterSpacing=o.ls+'em';el.style.lineHeight=o.lh;el.style.opacity=o.op??1;
    const ax=o.ax??0,ay=o.ay??0;
    el.style.transform=`translate(${o.x}px,${o.y}px) rotate(${o.rot||0}deg) scale(${o.sc??1},${o.scy??o.sc??1}) translate(${-ax*100}%,${-ay*100}%)`+(o.ry?` translate(50%,50%) perspective(1100px) rotateY(${o.ry}deg) translate(-50%,-50%)`:'');
    el.style.clipPath=o.clip?`inset(${o.clip[0]}% ${o.clip[1]}% ${o.clip[2]}% ${o.clip[3]}%)`:'none';
    const [p,k]=this.layers;const mis=o.mis||[0,0];
    p.L.style.color=o.pink;p.L.style.transform=`translate(${mis[0]}px,${mis[1]}px)`;p.L.style.opacity=o.pinkOp??1;
    k.L.style.color=o.color;k.L.style.mixBlendMode=o.blend;
    const n=this.text.length;
    for(let i=0;i<n;i++){
      const L=o.letter?o.letter(i,n):null;
      for(const layer of this.layers){const sp=layer.spans[i];
        if(L){sp.style.transform=`translate(${L.x||0}em,${L.y||0}em) rotate(${L.rot||0}deg) scale(${L.sc??1},${L.scy??L.sc??1})`;
          sp.style.opacity=L.op??1;sp.style.fontStretch=(L.wdth??o.wdth)+'%';sp.style.fontWeight=L.wght??o.wght;}
        else{sp.style.transform='';sp.style.opacity=1;sp.style.fontStretch='';sp.style.fontWeight='';}}
    }
  }
}
const T={
  tilt:new Txt('TILT',{size:300,wdth:118}),
  tap:new Txt('TAP',{size:300,wdth:118}),
  steer:new Txt('TO STEER.',{size:132,wdth:100,wght:850}),
  jump:new Txt('TO JUMP.',{size:132,wdth:100,wght:850}),
  tapjump:new Txt('TAP TO JUMP.',{size:84,wdth:100,wght:850}),
  orplay:new Txt('OR PLAY',{size:200,wdth:110}),
  handsfree:new Txt('HANDS-FREE.',{size:200,wdth:110}),
  step:new Txt('STEP',{size:120,wdth:120,color:C.pink,pink:C.ink,blend:'normal'}),
  hop:new Txt('HOP',{size:120,wdth:120,color:C.pink,pink:C.ink,blend:'normal'}),
  oneTrack:new Txt('ONE TRACK.',{size:176,wdth:112,color:C.paper,blend:'normal'}),
  everyone:new Txt('EVERYONE.',{size:176,wdth:112,color:C.paper,blend:'normal'}),
  everyDay:new Txt('EVERY DAY.',{size:176,wdth:112,color:C.paper,blend:'normal'}),
  fresh:new Txt('FRESH LOOK.',{size:112,wdth:108}),
  same:new Txt('SAME PLAYING FIELD.',{size:112,wdth:92}),
  veyro:new Txt('VEYRO',{size:236,wdth:112,color:C.paper,blend:'normal'}),
  run:new Txt('RUN',{size:236,wdth:112,color:C.paper,blend:'normal'}),
  tag1:new Txt('The controller is',{font:'Anybody',size:66,wght:700,wdth:100,ls:-.02,color:C.paper,blend:'normal',pinkOp:0}),
  tag2:new Txt('you.',{font:'Anybody',size:66,wght:700,wdth:100,ls:-.02,color:C.paper,blend:'normal',pinkOp:0}),
};

/* ---------- global misregistration: the pink plate slips on every hit ---------- */
const HITS=[2.0,5.0,5.62,7.02,8.0,9.5,11.0,13.5,14.0,14.5,15.1,18.0];
function misreg(t,base=1){
  let x=3.5*base,y=2.5*base;
  for(const h of HITS){const d=t-h;if(d>0&&d<1.2){x+=14*wob(d,5,.22);y+=9*wob(d,4.2,.22);}}
  return [x,y];
}
function shake(t){
  let x=0,y=0;
  for(const [h,a] of [[2.0,9],[18.0,12],[5.62,5],[11.0,5],[15.1,4]]){const d=t-h;if(d>0&&d<.6){x+=a*wob(d,11,.28);y+=a*.7*wob(d+.013,13,.28);}}
  return [x,y];
}

/* ============================================================
   GARDEN — the park biome, projected in real metres.
   Path half-width and camera height are chosen so the path's
   vanishing edges match the V monogram's inner notch (the cut at 2.0 s).
   ============================================================ */
const SPEED=16;             // m/s — BaseSpeed 12 + a few difficulty steps
const PZ=13;                // runner sits 13 m ahead of the camera
const CAMH=5.36;            // 2.6 m / 5.36 m = 0.485, the V's inner slope
const PATH_HW=2.6;
const T0=2.0;               // garden clock origin
const camZAt=t=>SPEED*(t-T0);
const LANE_KEYS=[[0,0],[2.5,-1],[3.0,1],[3.5,0],[4.0,-1],[4.5,1],[5.0,0],[5.9,1],[6.4,-1]];
function laneAt(t){let x=LANE_KEYS[0][1];for(let i=1;i<LANE_KEYS.length;i++){const [tk,l]=LANE_KEYS[i];const lp=LANE_KEYS[i-1][1];if(t>=tk)x=lerp(lp,l,E.inOutCubic(seg(t,tk,tk+.17)));}return x;}
const JUMP_T=5.04;          // tap at 5.0, lift-off one frame later
const playerY=t=>jumpY(t-JUMP_T);

const GARDEN=(()=>{
  const r=mulberry32(11);const trees=[],bushes=[],flowers=[];
  for(let z=-10;z<220;z+=3.6){for(const s of [-1,1]){
    trees.push({x:s*(4.9+r()*1.6),z:z+r()*1.8,kind:r()<.38?'cyp':'pop',k:.72+r()*.4});
    if(r()<.7)trees.push({x:s*(7.8+r()*5),z:z+r()*3,kind:r()<.45?'cyp':'pop',k:.85+r()*.4});}}
  for(let z=-10;z<220;z+=2.2){for(const s of [-1,1]){if(r()<.75)bushes.push({x:s*(3.15+r()*.5),z:z+r()*1.2,k:.55+r()*.5});}}
  for(let z=-10;z<220;z+=.55){const s=r()<.5?-1:1;flowers.push({x:s*(2.95+r()*6),z:z+r()*.5,h:.3+r()*.35,c:r()<.8?C.pink:C.gold});}
  const far=[];for(let i=0;i<80;i++)far.push({u:i/80,r:.4+r()*.8,h:r()});
  return {trees,bushes,flowers,far,pergolaZ:camZAt(3.43)};
})();

const TRACK=(()=>{
  const coins=[],planters=[],hurdles=[];const zAt=tc=>SPEED*(tc-T0)+PZ;
  for(let i=0;i<LANE_KEYS.length;i++){
    const t0=LANE_KEYS[i][0],t1=i+1<LANE_KEYS.length?LANE_KEYS[i+1][0]:7.4,lane=LANE_KEYS[i][1];
    for(let tc=Math.max(t0+.21,1.2);tc<t1-.05;tc+=.085){
      const air=tc>JUMP_T&&tc<JUMP_T+GAME.air;
      coins.push({lane,z:zAt(tc),tc,y:.95+(air?jumpY(tc-JUMP_T):0)});
    }
    if(i>0){const lp=LANE_KEYS[i-1][1];planters.push({lane:lp,z:zAt(t0+.32)});
      const other=[-1,0,1].find(l=>l!==lp&&l!==lane);if(other!==undefined)planters.push({lane:other,z:zAt(t0+.1)});}
  }
  for(let tc=1.0;tc<2.3;tc+=.4)planters.push({lane:tc<1.8?1:-1,z:zAt(tc)});
  hurdles.push({lane:0,z:zAt(JUMP_T+GAME.air/2)});
  for(const c of coins){c.got=Math.abs(laneAt(c.tc)-c.lane)<.5;}
  let combo=0;for(const c of coins){if(c.got&&c.tc>2.02&&c.tc<5.55){combo++;ev(c.tc,'coin',{n:combo});}}
  return {coins,planters,hurdles};
})();

function drawGarden(ctx,t,vp){
  const f=Math.max(vp.w*.57,vp.h*.62),hy=vp.y+vp.h*.4,cx=vp.x+vp.w/2;
  const camZ=camZAt(t),lane=laneAt(t),px=lane*GAME.laneW,camX=px*.28;
  const P=(x,y,z)=>{const dz=z-camZ;return [cx+(x-camX)*f/dz,hy+(CAMH-y)*f/dz,f/dz];};
  const fog=z=>clamp((z-camZ-25)/170)*.85;
  ctx.save();
  roundRect(ctx,vp.x,vp.y,vp.w,vp.h,vp.r||0);ctx.clip();
  if(vp.roll){const pvx=cx,pvy=vp.y+vp.h;ctx.translate(pvx,pvy);ctx.rotate(vp.roll);ctx.translate(-pvx,-pvy);}
  const M=Math.max(vp.w,vp.h);
  // sky + sun
  ctx.fillStyle=C.paper;ctx.fillRect(vp.x-M,vp.y-M,vp.w+2*M,vp.h+2*M);
  ctx.fillStyle=C.gold;ctx.beginPath();ctx.arc(cx+vp.w*.2-camX*6,hy-vp.h*.02,vp.h*.15,0,7);ctx.fill();
  ctx.fillStyle=rgba(C.gold,.35);ctx.beginPath();ctx.arc(cx+vp.w*.2-camX*6,hy-vp.h*.02,vp.h*.19,0,7);ctx.fill();
  // distant tree band
  for(const b of GARDEN.far){const x=vp.x-M*.3+(b.u*(vp.w+M*.6))-camX*10;const rr=vp.h*(.028+b.r*.03);
    ctx.fillStyle=b.h<.5?'#7FB3A1':'#6DA593';ctx.beginPath();ctx.arc(x,hy-rr*.35,rr,0,7);ctx.fill();}
  // ground
  ctx.fillStyle=C.haze;ctx.fillRect(vp.x-M,hy,vp.w+2*M,vp.h+2*M);
  const stripe=3,zFar=camZ+210;
  for(let k=Math.floor((camZ+.8)/stripe);k*stripe<zFar;k++){
    const z0=Math.max(k*stripe,camZ+.8),z1=(k+1)*stripe;const y0=P(0,0,z0)[1],y1=P(0,0,z1)[1];
    ctx.fillStyle=mix(k%2?C.mint:C.mintLight,C.haze,fog(z0));ctx.fillRect(vp.x-M,y1,vp.w+2*M,y0-y1+1);
  }
  // path slabs
  const slab=2;
  for(let k=Math.floor((camZ+.8)/slab);k*slab<zFar;k++){
    const z0=Math.max(k*slab,camZ+.8),z1=(k+1)*slab;
    const a=P(-PATH_HW,0,z0),b=P(PATH_HW,0,z0),c=P(PATH_HW,0,z1),d=P(-PATH_HW,0,z1);
    ctx.fillStyle=mix(C.pathStone,C.haze,fog(z0)*.6);poly(ctx,[a,b,c,d]);ctx.fill();
    ctx.strokeStyle=mix(C.stoneDark,C.haze,fog(z0)*.6);ctx.lineWidth=Math.max(.6,.05*b[2]);
    ctx.beginPath();ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0],b[1]);ctx.stroke();
    for(const s of [-1,1]){const e0=P(s*PATH_HW,0,z0),e1=P(s*(PATH_HW+.14),0,z0),e2=P(s*(PATH_HW+.14),0,z1),e3=P(s*PATH_HW,0,z1);
      ctx.fillStyle=mix(C.stone,C.haze,fog(z0)*.6);poly(ctx,[e0,e1,e2,e3]);ctx.fill();}
  }
  // the runner's ribbon — where you have been
  if(!vp.noRibbon){
    const pts=[];for(let d=0;d<=(PZ-1.2)/SPEED;d+=.012){const tt=t-d;pts.push([laneAt(tt)*GAME.laneW,camZ+PZ-SPEED*d]);}
    const L=[],R=[];for(const [x,z] of pts){L.push(P(x-.26,.01,z));R.push(P(x+.26,.01,z));}
    ctx.fillStyle=rgba(C.pink,.9);ctx.beginPath();L.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));
    for(let i=R.length-1;i>=0;i--)ctx.lineTo(R[i][0],R[i][1]);ctx.closePath();ctx.fill();
    const L2=[],R2=[];for(const [x,z] of pts){L2.push(P(x-.07,.012,z));R2.push(P(x+.07,.012,z));}
    ctx.fillStyle=rgba(C.paper,.75);ctx.beginPath();L2.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));
    for(let i=R2.length-1;i>=0;i--)ctx.lineTo(R2[i][0],R2[i][1]);ctx.closePath();ctx.fill();
  }
  // sprites, far to near
  const S=[];const inView=z=>z>camZ+1.2&&z<zFar;
  for(const o of GARDEN.trees)if(inView(o.z))S.push({z:o.z,d:()=>tree(ctx,P,o,fog(o.z))});

const SECTIONS=[[0,'00','INTRO'],[2,'01','TILT'],[5,'02','TAP'],[7,'03','HANDS-FREE'],[11,'04','DAILY RUN'],[15,'05','LOOKS'],[17.5,'06','VEYRO RUN']];

function drawHUD(ctx,t,T_){

  const endFade=1-seg(t,18.6,19.1);
  const mis=misreg(t);

  const regP=E.outCubic(seg(t,0,.45));
  for(const [x,y] of [[56,56],[W-56,56],[56,H-56],[W-56,H-56]]){
    for(const pass of [0,1]){ctx.save();ctx.strokeStyle=pass?col:C.pink;ctx.globalAlpha=pass?.9:.9;
      if(!pass)ctx.translate(mis[0]*.5,mis[1]*.5);ctx.lineWidth=2;
      ctx.beginPath();ctx.arc(x,y,13,-Math.PI/2,-Math.PI/2+Math.PI*2*regP);ctx.stroke();
      const L=24*regP;ctx.beginPath();ctx.moveTo(x-L,y);ctx.lineTo(x+L,y);ctx.moveTo(x,y-L);ctx.lineTo(x,y+L);ctx.stroke();ctx.restore();}

  ctx.textAlign='right';ctx.fillText(typed('SHIPATON 2026',.2),W-98,62);
  let sec=SECTIONS[0];for(const s of SECTIONS)if(t>=s[0])sec=s;
  const since=t-sec[0];const lab=`${sec[1]} / ${sec[2]}`;
  ctx.textAlign='left';ctx.fillText(lab.slice(0,Math.floor(clamp(since*60,0,lab.length))),98,H-52);
  const fr=Math.floor(T_*60+1e-6);const tc=`00:00:${String(Math.floor(fr/60)).padStart(2,'0')}:${String(fr%60).padStart(2,'0')}`;

const GRAIN=[];

  for(let i=0;i<d.data.length;i+=4){const n=r();const m=255-Math.pow(r(),5)*120-n*22;d.data[i]=d.data[i+1]=d.data[i+2]=m;d.data[i+3]=255;}g.putImageData(d,0,0);
  const s=document.createElement('canvas');s.width=s.height=384;const gs=s.getContext('2d');const ds=gs.createImageData(384,384);
  for(let i=0;i<ds.data.length;i+=4){const n=r();const m=n>.985?140:n>.9?38:0;ds.data[i]=ds.data[i+1]=ds.data[i+2]=m;ds.data[i+3]=255;}gs.putImageData(ds,0,0);
  GRAIN.push({m:gM.createPattern(c,'repeat'),s:gS.createPattern(s,'repeat')});}}

  for(const [ctx,p] of [[gM,GRAIN[k].m],[gS,GRAIN[k].s]]){ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle='#000';ctx.clearRect(0,0,W,H);

// 00 — the ticket prints, then the camera falls into the V (0 – 2 s)
function sceneTicket(t){
  const ctx=main;
  // background: paper, flooded with ink from the V
  ctx.fillStyle=C.paper;ctx.fillRect(0,0,W,H);
  const flood=E.inOutCubic(seg(t,.62,1.0));
  if(flood>0){ctx.fillStyle=C.ink;ctx.beginPath();ctx.arc(960,500,flood*1250,0,7);ctx.fill();}
  // fall-through camera: rotate 180°, anticipate, then accelerate into the notch
  const mv=seg(t,1.2,2.0);
  const rot=lerp(-7,180,E.inOutQuart(mv))*Math.PI/180;
  const sc=.9*(1-.08*Math.sin(Math.PI*seg(t,1.2,1.42)))*(mv<=0?1:1)*lerp(1,3.2,E.inExpo(seg(t,1.36,2.0))*.35+E.inQuart(seg(t,1.36,2.0))*.65);
  const startApex=[960+V_APEX[0]*.9,560+V_APEX[1]*.9];
  const endApex=[960,432];
  const ea=E.inOutCubic(mv);const ax=lerp(startApex[0],endApex[0],ea),ay=lerp(startApex[1],endApex[1],ea);
  const cr=Math.cos(rot),sr=Math.sin(rot);const vx=V_APEX[0]*sc,vy=V_APEX[1]*sc;
  const cx=ax-(vx*cr-vy*sr),cy=ay-(vx*sr+vy*cr);
  const intro=t<1.2?560+(1-E.outCubic(seg(t,0,.5)))*0:0;
  drawTicket(ctx,{x:t<1.2?960:cx,y:t<1.2?560:cy,sc:t<1.2?.9:sc,rot:t<1.2?-7*Math.PI/180:rot,
    vL:E.inOutCubic(seg(t,.12,.42)),vR:E.inOutCubic(seg(t,.36,.66)),bars:seg(t,.78,1.18),card:seg(t,.6,.92),
    stub:seg(t,.95,1.1)*(1-seg(t,1.25,1.4)),mis:misreg(t)});
  // speed lines as we fall in
  const fall=seg(t,1.55,2.0);
  if(fall>0){const r=mulberry32(21);ctx.save();ctx.strokeStyle=rgba(C.paper,.5*fall);ctx.lineWidth=3;
    for(let i=0;i<40;i++){const an=r()*Math.PI*2,d0=200+r()*600,len=(60+r()*260)*E.inQuad(fall);const ox=960,oy=432;
      ctx.beginPath();ctx.moveTo(ox+Math.cos(an)*d0,oy+Math.sin(an)*d0);ctx.lineTo(ox+Math.cos(an)*(d0+len),oy+Math.sin(an)*(d0+len));ctx.stroke();}ctx.restore();}
  ev(0.12,'swoosh');ev(0.36,'swoosh');ev(0.62,'stamp');

// 03 — HANDS-FREE (7 – 11 s): the owner-approved guide art + the phone's-eye view
const CAM_SHOTS=[[7.0,'camera_02',0,0],[8.0,'camera_04',1,0],[8.5,'camera_04m',-1,0],[9.0,'camera_02',0,0],[9.5,'camera_05',0,1],[10.0,'camera_02',0,0]];
function camShot(t){let s=CAM_SHOTS[0],i=0;for(let k=0;k<CAM_SHOTS.length;k++)if(t>=CAM_SHOTS[k][0]){s=CAM_SHOTS[k];i=k;}return {s,i,prev:CAM_SHOTS[Math.max(0,i-1)]};}
function sceneCamera(t){
  const ctx=main;ctx.fillStyle=C.paper;ctx.fillRect(0,0,W,H);

  const tx=lerp(960,120,tuck),ty1=lerp(330,92,tuck),ty2=lerp(530,166,tuck),ts=lerp(1,.4,tuck),ax=lerp(.5,0,tuck);

  const st=E.outBackBig(seg(t,7.95,8.15));if(st>0){ov.save();ov.globalAlpha=1-seg(t,10.76,10.9);ov.translate(600,146);ov.rotate(-.06);ov.scale(st,st);ov.fillStyle=C.gold;roundRect(ov,-8,-26,300,50,25);ov.fill();
    ov.fillStyle=C.ink;ov.font='19px Mono';ov.letterSpacing='3px';ov.fillText('CAMERA MODE · BETA',14,7);ov.restore();}

  if(vf>0&&grow<.5){const a=clamp(vf*2)*(1-seg(t,10.78,10.9));

    // tracked face: follows the shot's lean/hop with a spring
    let fx=0,fy=0;{let px=0,py=0;for(const sh of CAM_SHOTS){const d=t-sh[0]-.04;if(d<0)break;px=lerp(px,sh[2],spring(d,2.6,.5));py=lerp(py,sh[3],spring(d,3,.45));}fx=px;fy=py;}
    const hop=t>9.5&&t<10?Math.sin(Math.PI*seg(t,9.54,9.9)):0;

  T.run.set({x:LX,y:474,color:C.pink,pink:C.paper,mis:[mis[0]*1.3,mis[1]*1.3],letter:(i)=>{const a=E.outBack(seg(t,18.14+i*.04,18.42+i*.04));return {y:(1-a)*-1.4,rot:(1-a)*14,op:clamp(a*4),wdth:lerp(150,112,E.outCubic(seg(t,18.14+i*.04,18.56+i*.04)))};}});
  const tg=E.outExpo(seg(t,18.5,18.8));
  T.tag1.set({x:LX+8,y:726,clip:[-20,100-tg*100,-10,-5]});
  T.tag2.set({x:LX+8+tagWidth(),y:726,color:C.pink,letter:(i)=>{const a=E.outBack(seg(t,18.72+i*.03,18.92+i*.03));return {sc:a,op:clamp(a*3)};}});
  // platform line: ?end= picks a variant (default = v2 as released; the others are the submission cut's cards)
  const lines=END_LINES[END]||END_LINES[''];
  lines.forEach((L,k)=>{const t0=18.96+k*.28;if(t<=t0-.01)return;const n=END.startsWith('closing')?L.text.length:Math.floor(clamp((t-t0)*70,0,L.text.length));
    ov.save();ov.fillStyle=L.color;ov.font=L.font;ov.letterSpacing=L.ls;ov.fillText(L.text.slice(0,n),LX+12,840+k*48);ov.restore();});
  ev(18.0,'slam_big');ev(17.55,'pop');
}
const END=new URLSearchParams(location.search).get('end')||'';
const CATEGORIES='Best Game  ·  Design  ·  HAMM  ·  #BuildInPublic  ·  OneSignal';
const END_LINES={
  '':[{text:'iPhone & Android  ·  Free to play  ·  No ads',color:'rgba(251,245,233,.78)',font:'24px Mono',ls:'3px'}],
  noplatform:[{text:'Free to play  ·  No ads  ·  Cosmetics only',color:'rgba(251,245,233,.78)',font:'24px Mono',ls:'3px'}],

  'closing-play':[{text:CATEGORIES,color:'rgba(251,245,233,.78)',font:'20px Mono',ls:'2px'},{text:'https://play.google.com/store/apps/details?id=com.ferrabled.veyro.run',color:C.gold,font:'19px Mono',ls:'1px'}],
};
let _tw=0;function tagWidth(){if(!_tw){const m=document.createElement('canvas').getContext('2d');m.font='700 66px Anybody';m.letterSpacing='-1.32px';_tw=m.measureText('The controller is ').width;}return _tw;}

/* ============================================================
   SEEK
   ============================================================ */
function seek(T_){
  let t=T_*TS;
  t=clamp(t,0,DUR-1e-6);P3.box.style.display='none';
  for(const x of TXTS){if(x.shown){x.el.style.display='none';x.shown=false;}}
  main.setTransform(1,0,0,1,0,0);ov.setTransform(1,0,0,1,0,0);ov.clearRect(0,0,W,H);
  main.globalAlpha=1;main.globalCompositeOperation='source-over';
  if(t<2.0)sceneTicket(t);
  else if(t<5.46)sceneTilt(t);
  else if(t<5.68){sceneTilt(t);sceneJumpDiagramIris(t);}
  else if(t<7.02)sceneJumpDiagram(t);
  else if(t<11.06)sceneCamera(t);
  else if(t<15.0)sceneDaily(t);
  else if(t<17.5)sceneLooks(t);
  else sceneEnd(t);
  // 7.0 curtain: pink falls, paper follows
  if(t>6.86&&t<7.3){const a=E.inOutCubic(seg(t,6.86,7.04)),b=E.inOutCubic(seg(t,6.98,7.26));ov.fillStyle=C.pink;ov.fillRect(0,H*b,W,H*(a-b));ov.fillStyle=C.gold;ov.fillRect(0,H*a-18,W,18*(a<1?1:0));}
  drawHUD(ov,t,T_);drawGrain(T_,t);
  const [sx,sy]=shake(t);stage.style.transform=(sx||sy)?`translate(${sx}px,${sy}px) scale(1.012)`:'none';
}
// the tap iris overlays the phone scene for its first frames
function sceneJumpDiagramIris(t){const ir=seg(t,5.46,5.68);const cx=PHONE.x,cy=PHONE.y+260;
  const rP=E.inOutCubic(clamp(ir*1.6))*2300,rI=E.inOutCubic(clamp(ir*1.6-.6))*2300;
  ov.save();ov.fillStyle=C.pink;ov.beginPath();ov.arc(cx,cy,rP,0,7);ov.fill();ov.restore();
  if(rI>0){ov.save();ov.beginPath();ov.arc(cx,cy,rI,0,7);ov.clip();ov.fillStyle=C.paper;ov.fillRect(0,0,W,H);ov.restore();}}

/* ---------- cue list: build once by sweeping the timeline ---------- */
function buildCues(){
  EVENTS.length=0;
  // coins were pushed by TRACK already; re-add them
  let combo=0;for(const c of TRACK.coins){if(c.got&&c.tc>2.02&&c.tc<5.55){combo++;EVENTS.push({t:+c.tc.toFixed(4),type:'coin',n:combo});}}
  const add=(t,type)=>EVENTS.push({t,type});
  add(.12,'swoosh');add(.36,'swoosh');add(.62,'stamp');add(1.25,'riser');
  add(2.46,'swoosh');add(2.96,'swoosh');add(3.46,'swoosh');add(3.5,'whoosh');add(3.94,'swoosh');add(4.44,'swoosh');add(4.94,'swoosh');
  add(4.98,'tap');add(5.04,'jump');add(5.46,'whoosh');
  add(5.88,'tap');add(5.9,'jump');add(6.6,'tap');add(6.62,'jump');add(6.86,'whoosh');
  add(7.95,'stamp');add(8.0,'swoosh');add(8.5,'swoosh');add(9.52,'jump');add(10.02,'type');add(10.78,'whoosh');
  for(let i=0;i<8;i++)add(+(11.28+i*.06).toFixed(4),'tick');add(12.0,'type');add(12.34,'print');add(12.9,'whoosh');
  add(13.5,'slam');add(14.0,'slam');add(14.5,'slam');add(14.96,'whoosh');
  for(let i=0;i<3;i++){add(+(15.12+i*.2+.18).toFixed(4),'deal');add(+(16.3+i*.09).toFixed(4),'flip');}
  add(16.72,'type');add(17.2,'whoosh');add(17.55,'pop');add(18.0,'slam_big');add(18.72,'pop2');add(18.96,'type');
  EVENTS.sort((a,b)=>a.t-b.t);
}

  await Promise.all([document.fonts.load('900 100px Anybody'),document.fonts.load('700 66px Anybody'),document.fonts.load('800 100px Anybody'),document.fonts.load('20px Mono'),document.fonts.load('400 20px Atkinson')]);
  await document.fonts.ready;
  await Promise.all([['camera_02','img/camera_02.png'],['camera_04','img/camera_04.png'],['camera_05','img/camera_05.png'],
    ['skin-ember','img/skin-ember.webp'],['skin-frost','img/skin-frost.webp'],['skin-prism','img/skin-prism.webp']].map(([k,s])=>loadImg(k,s)));
  // mirrored lean for the left step
  const m=document.createElement('canvas');m.width=IMG.camera_04.width;m.height=IMG.camera_04.height;const mc=m.getContext('2d');mc.translate(m.width,0);mc.scale(-1,1);mc.drawImage(IMG.camera_04,0,0);IMG.camera_04m=m;
  buildGrain();buildCues();
  window.seek=seek;window.EVENTS=EVENTS;window.DUR=OUT_DUR;window.TIMESCALE=TS;
  // interactive preview: ?t=3.2 freezes a frame, otherwise plays in real time
  const q=new URLSearchParams(location.search);
  if(q.has('t'))seek(+q.get('t'));
  else if(!q.has('render')){const t0=performance.now();const loop=()=>{seek(((performance.now()-t0)/1000)%OUT_DUR);requestAnimationFrame(loop);};loop();}
  return true;
})();
